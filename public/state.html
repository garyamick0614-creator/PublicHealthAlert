<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State health feeds · PublicHealthAlert</title>
  <meta name="description" content="Per-state public-health feeds: every US state with 25+ DOH, immunization, outbreak, and surveillance sources." />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314b8a6'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='system-ui' font-size='34' font-weight='800' fill='%230b1220'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <style>
    .state-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:16px 0 24px}
    .state-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-family:inherit}
    .state-btn:hover{border-color:var(--accent)}
    .state-btn.active{background:var(--accent);color:#03222b;border-color:var(--accent);font-weight:600}
    .state-name{font-size:13px;font-weight:600}
    .state-meta{font-size:11px;opacity:.7;margin-top:2px}
    .feeds-list{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
    .feed-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
    .feed-row:last-child{border-bottom:0}
    .feed-row:hover{background:rgba(20,184,166,.04)}
    .feed-name{font-size:14px;font-weight:500}
    .feed-url{font-size:11.5px;opacity:.6;font-family:ui-monospace,Menlo,monospace;margin-top:2px;word-break:break-all}
    .feed-open{font-size:12px;color:var(--accent);text-decoration:none;padding:5px 10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;white-space:nowrap}
    .feed-open:hover{border-color:var(--accent);background:rgba(20,184,166,.1);color:#fff}
  </style>
</head>
<body data-page="state">
  <header class="site-header" id="appHeader" role="banner"></header>

  <main class="container">
    <section class="hero fade-in">
      <h1 class="hero-title">State public-health feeds</h1>
      <p class="hero-subtitle">Pick a state. Every state has 25+ feeds wired: DOH press, immunization, outbreaks, MMWR, communicable disease, food safety, lab, recalls, opioid, mental health, and more.</p>
    </section>

    <section class="section">
      <div class="state-grid" id="stateGrid"></div>
      <h2 class="section-title" id="stateTitle">Select a state above</h2>
      <div class="feeds-list" id="feedsList"></div>
    </section>
  </main>

  <footer class="site-footer" id="appFooter"></footer>

  <script type="module">
    import { mount } from "./assets/layout.js";
    mount();
  </script>
  <script>
    const API = 'https://api.thatcomputerguy26.org';
    let states = [];
    let activeCode = '';

    function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function init() {
      const r = await fetch(API + '/api/world/source-registry/health', { cache: 'no-cache' });
      const d = await r.json();
      states = (d.states || []).slice().sort((a,b) => a.name.localeCompare(b.name));
      renderGrid();
      const q = new URLSearchParams(location.search).get('s');
      if (q) selectState(q.toUpperCase());
    }

    function renderGrid() {
      document.getElementById('stateGrid').innerHTML = states.map(s => `
        <button class="state-btn${activeCode===s.code?' active':''}" data-code="${esc(s.code)}">
          <div class="state-name">${esc(s.name)}</div>
          <div class="state-meta">${esc(s.code)} · 25+ feeds</div>
        </button>
      `).join('');
      document.querySelectorAll('[data-code]').forEach(b => {
        b.addEventListener('click', () => selectState(b.dataset.code));
      });
    }

    async function selectState(code) {
      activeCode = code;
      const state = states.find(s => s.code === code);
      if (!state) return;
      renderGrid();
      history.replaceState(null,'', '?s=' + code);
      document.getElementById('stateTitle').textContent = state.name + ' — public-health feeds';
      document.getElementById('feedsList').innerHTML = '<div style="padding:30px;text-align:center;opacity:.6">Loading feeds…</div>';
      try {
        const r = await fetch(API + '/api/world/source-registry/health?state=' + code, { cache: 'no-cache' });
        const d = await r.json();
        const all = [
          ...((d.feeds && d.feeds.rss) || []),
          ...((d.feeds && d.feeds.api) || [])
        ];
        if (all.length === 0) {
          document.getElementById('feedsList').innerHTML = '<div style="padding:30px;text-align:center;opacity:.6">No feeds wired for this state yet.</div>';
          return;
        }
        document.getElementById('feedsList').innerHTML = all.map(f => `
          <div class="feed-row">
            <div>
              <div class="feed-name">${esc(f.source||'(unnamed)')}</div>
              <div class="feed-url">${esc(f.url||'')}</div>
            </div>
            <a class="feed-open" href="${esc(f.url||'#')}" target="_blank" rel="noopener">Open feed →</a>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('feedsList').innerHTML = '<div style="padding:30px;text-align:center;opacity:.6">Could not load: ' + esc(e.message) + '</div>';
      }
    }

    init();
  </script>
  <script src="./assets/visitor.js"></script>

  <!-- pha:auto-refresh -->
  <script src="./assets/auto-refresh.js" defer></script>
</body>
</html>
