<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06121b"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0c2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <circle cx="120" cy="110" r="46" fill="#14b8a6"/>
  <text x="120" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="58" font-weight="800" fill="#0b1220">P</text>
  <text x="80" y="240" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#14b8a6" letter-spacing="6">PUBLIC HEALTH ALERT</text>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Cross-border virus spread,</text>
  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="68" font-weight="800" fill="#ffffff">organized for the U.S.</text>
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">CDC · WHO · PAHO · ECDC · Africa CDC — refreshed nightly</text>
  <g transform="translate(80, 550)">
    <circle cx="10" cy="10" r="6" fill="#f59e0b"/>
    <text x="30" y="16" font-family="system-ui, sans-serif" font-size="22" fill="#cbd5e1" font-weight="600">publichealthalert.netlify.app</text>
  </g>
