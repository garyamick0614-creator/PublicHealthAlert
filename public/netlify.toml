# Netlify configuration — static publish, no build step
# Site source: https://github.com/garyamick0614-creator/PublicHealthAlert

[build]
  publish = "public"
  # No build command — public/ is already deploy-ready static content.
  # Data is regenerated by the local operator PC at 01:00/02:00 and pushed.

[build.environment]
  NODE_VERSION = "20"

# Cache the JSON data feeds for a short window so repeat visits are fast,
# but never longer than a refresh cycle.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    # must-revalidate removed 2026-06-17 (flagged; max-age=300 is sufficient)
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    # X-Frame-Options removed 2026-06-17: CSP frame-ancestors 'none' covers modern browsers
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # script-src: self (all assets local) + TCG visitor beacon
    # connect-src: TCG API for all data fetches + PHA endpoints + push VAPID
    # worker-src: self for push-sw.js service worker
    # img-src: data: for inline SVG favicon; blob: for maplibre tile rendering
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://api.thatcomputerguy26.org; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.thatcomputerguy26.org; img-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
